<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GameZone Admin - Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
<div class="flex min-h-screen">
<button id="menuBtn" class="md:hidden fixed top-4 left-4 z-20 bg-blue-600 text-white rounded-xl px-3 py-2">☰</button>
<aside id="sidebar" class="hidden md:flex flex-col w-64 bg-white shadow-md fixed md:static inset-y-0 left-0 z-10 p-6 space-y-2">
<h2 class="text-xl font-bold text-blue-600 mb-6">GameZone</h2>
<a href="/dashboard.html" class="block px-4 py-2 rounded-xl bg-blue-600 text-white font-medium">Dashboard</a>
<a href="/send-notification.html" class="block px-4 py-2 rounded-xl hover:bg-gray-100">Send Notification</a>
<a href="/history.html" class="block px-4 py-2 rounded-xl hover:bg-gray-100">History</a>
<button onclick="Api.logout()" class="text-left px-4 py-2 rounded-xl hover:bg-gray-100 text-red-600 mt-auto">Logout</button>
</aside>
<main class="flex-1 p-6 md:p-10 pt-16 md:pt-10">
<h1 class="text-2xl font-bold mb-6">Dashboard</h1>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl">
<div class="bg-white shadow-md rounded-xl p-6">
<p class="text-gray-500 text-sm">Registered devices</p>
<p id="statDevices" class="text-3xl font-bold">–</p>
</div>
<div class="bg-white shadow-md rounded-xl p-6">
<p class="text-gray-500 text-sm">Notifications sent</p>
<p id="statNotifications" class="text-3xl font-bold">–</p>
</div>
</div>
<div class="flex flex-col sm:flex-row gap-4 mt-6">
<a href="/send-notification.html" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl px-6 py-3 text-center">Send Notification</a>
<a href="/history.html" class="bg-white shadow-md rounded-xl px-6 py-3 text-center font-medium">View History</a>
</div>
<p id="error" class="text-red-600 text-sm mt-4 hidden"></p>
</main>
</div>
<script src="/js/api.js"></script>
<script>
Api.requireAuth();
document.getElementById("menuBtn").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("hidden");
});
(async () => {
  try {
    const s = await Api.getStats();
    document.getElementById("statDevices").textContent = s.devices;
    document.getElementById("statNotifications").textContent = s.notifications;
  } catch (e) {
    const err = document.getElementById("error");
    err.textContent = e.message;
    err.classList.remove("hidden");
  }
})();
</script>
</body>
</html>
