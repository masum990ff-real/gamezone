<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GameZone Admin - Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/premium.css" />
</head>
<body class="min-h-screen text-slate-800">
<div class="aurora"><span></span><span></span><span></span></div>

<div class="flex min-h-screen">
<button id="menuBtn" class="md:hidden fixed top-4 left-4 z-20 btn-grad text-white rounded-2xl px-3.5 py-2 font-bold">☰</button>
<aside id="sidebar" class="hidden md:flex flex-col w-64 shrink-0 fixed md:static inset-y-0 left-0 z-10 p-6 text-white" style="background: linear-gradient(180deg, #0f0b2d, #2e1065 70%, #4c1d95);">
<div class="flex items-center gap-2.5 mb-10">
<div class="w-10 h-10 rounded-2xl bg-white text-lg font-extrabold flex items-center justify-center shadow-lg"><span class="grad-text">G</span></div>
<div>
<h2 class="text-lg font-extrabold leading-none">GameZone</h2>
<p class="text-[11px] text-violet-300 mt-1">Admin Panel</p>
</div>
</div>
<nav class="space-y-2 text-sm font-semibold">
<a href="/dashboard.html" class="nav-active flex items-center gap-3 px-4 py-3 rounded-2xl text-white">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10"/></svg>
Dashboard</a>
<a href="/send-notification.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
Send Notification</a>
<a href="/history.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
History</a>
<a href="/users.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
Users</a>
</nav>
<button onclick="Api.logout()" class="text-left px-4 py-3 rounded-2xl text-rose-300 hover:bg-white/10 font-semibold text-sm mt-auto transition">Logout</button>
</aside>
<div id="overlay" class="hidden fixed inset-0 bg-black/40 z-[5] md:hidden"></div>

<main class="flex-1 p-6 md:p-10 pt-16 md:pt-10 w-full max-w-4xl mx-auto">
<div class="flex items-center justify-between mb-6 anim-in">
<div>
<h1 class="text-2xl md:text-3xl font-extrabold">Dash<span class="grad-text">board</span></h1>
<p class="text-sm text-slate-500 mt-1">Push notification overview</p>
</div>
<button id="refreshBtn" class="glass card-lift shadow-lg rounded-2xl px-4 py-2.5 text-sm font-bold text-violet-700">Refresh</button>
</div>

<div id="errorCard" class="hidden glass border-l-4 !border-l-rose-500 text-rose-700 rounded-2xl px-4 py-3 text-sm mb-4 shadow">
<span id="errorText"></span>
<button id="retryBtn" class="ml-2 font-bold underline">Retry</button>
</div>

<div class="grid grid-cols-2 lg:grid-cols-3 gap-4">
<div class="anim-in d1 glass card-lift shadow-xl rounded-3xl p-5 relative overflow-hidden">
<div class="absolute -right-6 -top-6 w-28 h-28 rounded-full bg-indigo-400/20 blur-xl"></div>
<div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white shadow-lg mb-3" style="background: linear-gradient(135deg,#6366f1,#22d3ee);">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
</div>
<p class="text-slate-500 text-xs sm:text-sm font-medium">Registered devices</p>
<p id="statDevices" class="text-3xl sm:text-4xl font-extrabold mt-1">–</p>
</div>
<div class="anim-in d2 glass card-lift shadow-xl rounded-3xl p-5 relative overflow-hidden">
<div class="absolute -right-6 -top-6 w-28 h-28 rounded-full bg-fuchsia-400/20 blur-xl"></div>
<div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white shadow-lg mb-3" style="background: linear-gradient(135deg,#d946ef,#f59e0b);">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
</div>
<p class="text-slate-500 text-xs sm:text-sm font-medium">Notifications sent</p>
<p id="statNotifications" class="text-3xl sm:text-4xl font-extrabold mt-1">–</p>
</div>
<a href="/users.html" class="anim-in d3 glass card-lift shadow-xl rounded-3xl p-5 relative overflow-hidden col-span-2 lg:col-span-1">
<div class="absolute -right-6 -top-6 w-28 h-28 rounded-full bg-emerald-400/20 blur-xl"></div>
<div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white shadow-lg mb-3" style="background: linear-gradient(135deg,#10b981,#3b82f6);">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
</div>
<p class="text-slate-500 text-xs sm:text-sm font-medium">Total users</p>
<p id="statUsers" class="text-3xl sm:text-4xl font-extrabold mt-1">–</p>
</a>
</div>

<div class="flex flex-col sm:flex-row gap-3 mt-5 anim-in d3">
<a href="/send-notification.html" class="btn-grad flex-1 text-white font-bold rounded-2xl px-6 py-4 text-center">Send Notification</a>
<a href="/history.html" class="glass card-lift flex-1 shadow-lg rounded-2xl px-6 py-4 text-center font-bold text-violet-700">View History</a>
</div>

<div class="glass shadow-xl rounded-3xl mt-5 overflow-hidden anim-in d4">
<div class="flex items-center justify-between px-5 py-4 border-b border-violet-100">
<h2 class="font-extrabold">Recent notifications</h2>
<a href="/history.html" class="text-sm font-bold grad-text">See all</a>
</div>
<ul id="recentList" class="divide-y divide-violet-50">
<li class="px-5 py-4 text-sm text-slate-400">Loading…</li>
</ul>
</div>
</main>
</div>
<script src="/js/api.js"></script>
<script>
Api.requireAuth();
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
function toggleMenu(force) {
  const show = force !== undefined ? force : sidebar.classList.contains("hidden");
  sidebar.classList.toggle("hidden", !show);
  overlay.classList.toggle("hidden", !show);
}
document.getElementById("menuBtn").addEventListener("click", () => toggleMenu());
overlay.addEventListener("click", () => toggleMenu(false));

function showError(msg) {
  document.getElementById("errorText").textContent = msg;
  document.getElementById("errorCard").classList.remove("hidden");
}
function hideError() {
  document.getElementById("errorCard").classList.add("hidden");
}
function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function countUp(el, target) {
  const t0 = performance.now();
  const dur = 800;
  function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

async function load() {
  hideError();
  const dEl = document.getElementById("statDevices");
  const nEl = document.getElementById("statNotifications");
  const uEl = document.getElementById("statUsers");
  dEl.classList.add("shimmer");
  nEl.classList.add("shimmer");
  uEl.classList.add("shimmer");
  try {
    const [s, h] = await Promise.all([Api.getStats(), Api.getHistory(1, 5)]);
    dEl.classList.remove("shimmer");
    nEl.classList.remove("shimmer");
    uEl.classList.remove("shimmer");
    countUp(dEl, s.devices);
    countUp(nEl, s.notifications);
    countUp(uEl, s.users || 0);
    document.getElementById("recentList").innerHTML = h.items.map((n) => `
      <li class="px-5 py-3.5 flex gap-3 items-start">
        <span class="mt-1.5 w-2.5 h-2.5 rounded-full shrink-0" style="background: var(--grad);"></span>
        <div class="min-w-0">
          <p class="font-bold text-sm">${escapeHtml(n.title)}</p>
          <p class="text-xs text-slate-500 truncate mt-0.5">${escapeHtml(n.body)}</p>
          <p class="text-xs text-slate-400 mt-1">${new Date(n.sentAt).toLocaleString()} · Reach ~${n.successCount}</p>
        </div>
      </li>`).join("") || `<li class="px-5 py-6 text-center text-sm text-slate-400">No notifications sent yet — send your first one!</li>`;
  } catch (e) {
    dEl.classList.remove("shimmer");
    nEl.classList.remove("shimmer");
    uEl.classList.remove("shimmer");
    showError(e.message);
  }
}
document.getElementById("refreshBtn").addEventListener("click", load);
document.getElementById("retryBtn").addEventListener("click", load);
load();
</script>
</body>
</html>
