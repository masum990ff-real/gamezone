</div>

<a href="/history.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition">

<a href="/users.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition">

 Users</a>
<a href="/categories.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition">

 Category Management</a>

<main class="flex-1 p-6 md:p-10 pt-16 md:pt-10 w-full max-w-5xl mx-auto">
<div class="flex items-center justify-between mb-6 anim-in">
<div>
<h1 class="text-2xl md:text-3xl font-extrabold">Match <span class="grad-text">Management</span></h1>
<p id="countInfo" class="text-sm text-slate-500 mt-1">Create and manage matches by category</p>
</div>
<button id="refreshBtn" class="glass card-lift shadow-lg rounded-2xl px-4 py-2.5 text-sm font-bold text-violet-700">Refresh</button>
</div>
<div id="errorCard" class="hidden glass border-l-4 !border-l-rose-500 text-rose-700 rounded-2xl px-4 py-3 text-sm mb-4 shadow"><span id="errorText"></span><button id="retryBtn" class="ml-2 font-bold underline">Retry</button></div>
<form id="matchForm" class="anim-in d1 glass shadow-xl rounded-3xl p-6 space-y-4 mb-6">
<div class="grid sm:grid-cols-2 gap-3">
<div><label class="block text-xs font-bold mb-1">Category</label><select id="fCategory" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500"></select></div>
<div><label class="block text-xs font-bold mb-1">Banner URL</label><input id="fBannerUrl" type="url" maxlength="500" placeholder="https://..." class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /></div>
<div><label class="block text-xs font-bold mb-1">Match Title</label><input id="fTitle" type="text" maxlength="80" placeholder="ONLY 10 LW HEAD 1V1 TOURNAMENT #RAJU" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /></div>
<div><label class="block text-xs font-bold mb-1">Match Number</label><input id="fMatchNumber" type="text" maxlength="20" placeholder="RAJU01" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /></div>
<div><label class="block text-xs font-bold mb-1">Time & Date</label><input id="fTimeDate" type="datetime-local" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /></div>
 <div><label class="block text-xs font-bold mb-1">Prize Distribution</label><select id="fPrizeType" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500"><option value="all">All</option><option value="survival">Survival</option></select></div>
 <div id="prizeAllGroup"><label class="block text-xs font-bold mb-1">Prize Pool</label><input id="fPrizePool" type="number" min="0" max="100000" placeholder="15" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /></div>
 <div id="prizeSurvivalGroup" class="hidden sm:col-span-2"><label class="block text-xs font-bold mb-1">Survival Prize (Rank 1-10)</label><div class="grid grid-cols-2 sm:grid-cols-5 gap-2"><input id="fRank1" type="number" min="0" max="100000" placeholder="Rank 1" class="w-full border border-violet-200 rounded-2xl px-3 py-2 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /><input id="fRank2" type="number" min="0" max="100000" placeholder="Rank 2" class="w-full border border-violet-200 rounded-2xl px-3 py-2 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /><input id="fRank3" type="number" min="0" max="100000" placeholder="Rank 3" class="w-full border border-violet-200 rounded-2xl px-3 py-2 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /><input id="fRank4" type="number" min="0" max="100000" placeholder="Rank 4" class="w-full border border-violet-200 rounded-2xl px-3 py-2 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /><input id="fRank5" type="number" min="0" max="100000" placeholder="Rank 5" class="w-full border border-violet-200 rounded-2xl px-3 py-2 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /><input id="fRank6" type="number" min="0" max="100000" placeholder="Rank 6" class="w-full border border-violet-200 rounded-2xl px-3 py-2 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /><input id="fRank7" type="number" min="0" max="100000" placeholder="Rank 7" class="w-full border border-violet-200 rounded-2xl px-3 py-2 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /><input id="fRank8" type="number" min="0" max="100000" placeholder="Rank 8" class="w-full border border-violet-200 rounded-2xl px-3 py-2 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /><input id="fRank9" type="number" min="0" max="100000" placeholder="Rank 9" class="w-full border border-violet-200 rounded-2xl px-3 py-2 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /><input id="fRank10" type="number" min="0" max="100000" placeholder="Rank 10" class="w-full border border-violet-200 rounded-2xl px-3 py-2 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /></div><div class="mt-2"><label class="block text-xs font-bold mb-1">Total Amount</label><input id="fPrizeTotal" type="number" min="0" max="100000" placeholder="Total" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /></div></div>
 <div><label class="block text-xs font-bold mb-1">Per Kill</label><input id="fPerKill" type="number" min="0" max="10000" placeholder="0" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /></div>
<div><label class="block text-xs font-bold mb-1">Entry Fee Type</label><select id="fEntryFeeType" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500"><option value="paid">Paid</option><option value="free">Free</option></select></div>
<div><label class="block text-xs font-bold mb-1">Entry Fee</label><input id="fEntryFee" type="number" min="0" max="10000" placeholder="10" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /></div>
<div><label class="block text-xs font-bold mb-1">Team Type</label><select id="fTeamType" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500"><option value="Solo">Solo</option><option value="Duo">Duo</option><option value="Squad">Squad</option></select></div>
<div><label class="block text-xs font-bold mb-1">Version</label><select id="fVersion" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500"><option value="TPP">TPP</option><option value="FPP">FPP</option></select></div>
<div><label class="block text-xs font-bold mb-1">Map</label><input id="fMap" type="text" maxlength="30" placeholder="IRON CAGE" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /></div>
 <div><label class="block text-xs font-bold mb-1">Slots</label><input id="fSlots" type="number" min="2" max="100" placeholder="2" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500" /></div>
<div><label class="block text-xs font-bold mb-1">Status</label><select id="fStatus" class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500"><option value="upcoming">Upcoming</option><option value="ongoing">Ongoing</option><option value="result">Result</option></select></div>
 </div>
 <div><label class="block text-xs font-bold mb-1">About / Match Rules</label><textarea id="fAbout" rows="5" maxlength="5000" placeholder="Write match rules..." class="w-full border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70 focus:outline-none focus:ring-2 focus:ring-violet-500"></textarea></div>
 <div class="flex gap-2"><button id="createBtn" type="submit" class="btn-grad text-white font-bold rounded-2xl px-6 py-3">Create Match</button><button id="cancelEditBtn" type="button" class="hidden glass border border-violet-200 rounded-2xl px-6 py-3 text-sm font-bold text-violet-700">Cancel</button></div>
</form>
<div class="flex gap-2 mb-4">
<select id="filterStatus" class="border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70"><option value="">All status</option><option value="upcoming">Upcoming</option><option value="ongoing">Ongoing</option><option value="result">Result</option></select>
<select id="filterCategory" class="border border-violet-200 rounded-2xl px-4 py-2.5 text-sm bg-white/70"><option value="">All categories</option></select>
</div>
<div class="glass shadow-xl rounded-3xl overflow-hidden anim-in d1">
<div class="overflow-x-auto">
<table class="w-full text-sm min-w-[820px]">
<thead><tr class="text-left text-xs uppercase tracking-wide text-violet-500 border-b border-violet-100 bg-violet-50/50"><th class="px-5 py-3.5">Banner</th><th class="px-5 py-3.5">Title</th><th class="px-5 py-3.5">Category</th><th class="px-5 py-3.5">Time</th><th class="px-5 py-3.5">Status</th><th class="px-5 py-3.5 text-right">Action</th></tr></thead>
<tbody id="rows" class="divide-y divide-violet-50"></tbody>
</table>
</div>
</div>
<div id="toast" class="hidden max-w-2xl mt-4 rounded-2xl px-4 py-3.5 text-sm font-semibold shadow-lg"></div>
<div id="ongoingModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-xl"><h3 class="font-bold text-lg mb-4">Set Match Ongoing</h3><label class="block text-xs font-bold mb-1">Room ID *</label><input id="mRoomId" class="w-full border border-violet-200 rounded-xl px-3 py-2 text-sm mb-3" placeholder="Enter Room ID"/><label class="block text-xs font-bold mb-1">Room Password *</label><input id="mRoomPass" class="w-full border border-violet-200 rounded-xl px-3 py-2 text-sm mb-3" placeholder="Enter Password"/><label class="flex items-center gap-2 text-sm mb-4"><input type="checkbox" id="mSend" checked/> Send notification to joined users</label><div class="flex gap-2 justify-end"><button onclick="closeOngoingModal()" class="glass border rounded-xl px-4 py-2 text-sm font-bold">Cancel</button><button onclick="submitOngoing()" class="btn-grad text-white rounded-xl px-5 py-2 text-sm font-bold">Submit</button></div></div></div>
</main>
</div>
<script src="/js/api.js?v=2"></script>
<script>
Api.requireAuth();
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");
function toggleMenu(f){const s=f!==undefined?f:sidebar.classList.contains("hidden");sidebar.classList.toggle("hidden",!s);overlay.classList.toggle("hidden",!s);}
document.getElementById("menuBtn").addEventListener("click",()=>toggleMenu());
overlay.addEventListener("click",()=>toggleMenu(false));
function showError(m){document.getElementById("errorText").textContent=m;document.getElementById("errorCard").classList.remove("hidden");}
function hideError(){document.getElementById("errorCard").classList.add("hidden");}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showToast(msg,ok){const t=document.getElementById("toast");t.textContent=msg;t.className="toast-in max-w-2xl mt-4 rounded-2xl px-4 py-3.5 text-sm font-semibold shadow-lg "+(ok?"bg-emerald-500 text-white":"bg-rose-500 text-white");}
let editingId=null;
function isoToLocal(iso){try{const d=new Date(iso);const pad=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}catch(e){return '';}}
function resetEdit(){editingId=null;document.getElementById("matchForm").reset();toggleEntryFee();togglePrizeType();const t=document.getElementById("fPrizeTotal");if(t) t.dataset.manual="";document.getElementById("createBtn").textContent="Create Match";document.getElementById("cancelEditBtn").classList.add("hidden");}
function fmtTime(iso){try{return new Date(iso).toLocaleString();}catch(e){return iso;}}
function statusPill(s){const l=String(s||"").toLowerCase();if(l==="ongoing") return '<span class="bg-emerald-100 text-emerald-700 text-xs font-bold rounded-full px-3 py-1">ongoing</span>';if(l==="result") return '<span class="bg-slate-200 text-slate-700 text-xs font-bold rounded-full px-3 py-1">result</span>';return '<span class="bg-amber-100 text-amber-700 text-xs font-bold rounded-full px-3 py-1">upcoming</span>';}
async function loadCategories(){
 try{
  const data=await Api.getCategories();
  const cats=data.categories||[];
  const sel=document.getElementById("fCategory");
  const fcat=document.getElementById("filterCategory");
  sel.innerHTML=cats.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")||'<option value="">No categories</option>';
  fcat.innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
 }catch(e){showError(e.message);}
}
function toggleEntryFee(){
 const t=document.getElementById("fEntryFeeType").value;
 const inp=document.getElementById("fEntryFee");
 if(t==="free"){inp.value=0;inp.disabled=true;inp.classList.add("opacity-50");}
 else {inp.disabled=false;inp.classList.remove("opacity-50"); if(inp.value==="0") inp.value="";}
}
document.getElementById("fEntryFeeType").addEventListener("change",toggleEntryFee);
toggleEntryFee();
function togglePrizeType(){
 const v=document.getElementById("fPrizeType").value;
 document.getElementById("prizeAllGroup").classList.toggle("hidden", v!=="all");
 document.getElementById("prizeSurvivalGroup").classList.toggle("hidden", v!=="survival");
}
document.getElementById("fPrizeType").addEventListener("change",togglePrizeType);
togglePrizeType();
function calcTotal(){
 let s=0;
 for(let i=1;i<=10;i++){const el=document.getElementById("fRank"+i); if(el && el.value) s+=Number(el.value)||0;}
 const tot=document.getElementById("fPrizeTotal");
 if(tot && document.getElementById("fPrizeType").value==="survival" && !tot.dataset.manual) tot.placeholder="Total (sum="+s+")";
}
for(let i=1;i<=10;i++){const el=document.getElementById("fRank"+i); if(el) el.addEventListener("input",calcTotal);}
document.getElementById("fPrizeTotal").addEventListener("input",function(){this.dataset.manual="1";});
document.getElementById("fPrizeType").addEventListener("change",function(){document.getElementById("fPrizeTotal").dataset.manual="";calcTotal();});
async function loadMatches(){
 hideError();
 document.getElementById("rows").innerHTML=[1,2,3].map(()=>`<tr><td colspan="6" class="px-5 py-4"><div class="shimmer h-5">&nbsp;</div></td></tr>`).join("");
 try{
  const cat=document.getElementById("filterCategory").value;
  const st=document.getElementById("filterStatus").value;
  const data=await Api.getMatches(cat||undefined, st||undefined);
  const list=data.matches||[];
  document.getElementById("countInfo").textContent=list.length+" matches";
  document.getElementById("rows").innerHTML=list.map(m=>`
   <tr class="hover:bg-violet-50/60 transition">
    <td class="px-5 py-3.5"><img src="${escapeHtml(m.bannerUrl)}" alt="" class="w-14 h-10 rounded-xl object-cover border border-violet-100" onerror="this.style.display='none'" /></td>
    <td class="px-5 py-3.5 font-bold text-xs max-w-[220px] truncate">${escapeHtml(m.title)}<div class="text-[11px] text-slate-400 font-normal">#${escapeHtml(m.matchNumber)}</div></td>
    <td class="px-5 py-3.5 text-xs">${escapeHtml(m.categoryName||m.categoryId)}</td>
    <td class="px-5 py-3.5 text-xs whitespace-nowrap">${escapeHtml(fmtTime(m.timeDate))}</td>
    <td class="px-5 py-3.5">${statusPill(m.status)}</td>
     <td class="px-5 py-3.5 text-right space-x-1">
      <button onclick="viewMatch('${m.id}')" class="bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold rounded-xl px-3 py-1.5">View</button>
      <button onclick="editMatch('${m.id}')" class="bg-violet-500 hover:bg-violet-600 text-white text-xs font-bold rounded-xl px-3 py-1.5">Edit</button>
      <button onclick="openStatusModal('${m.id}','${m.status||'upcoming'}')" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-xl px-3 py-1.5">Status</button>
      <button onclick="delMatch('${m.id}')" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold rounded-xl px-3 py-1.5">Delete</button>
     </td>
   </tr>`).join("")||`<tr><td colspan="6" class="px-5 py-8 text-center text-sm text-slate-400">No matches yet</td></tr>`;
 }catch(e){document.getElementById("rows").innerHTML="";showError(e.message);}
}
let ongoingMatchId=null;
function closeOngoingModal(){document.getElementById('ongoingModal').classList.add('hidden');}
async function submitOngoing(){
 const roomId=document.getElementById('mRoomId').value.trim();
 const pass=document.getElementById('mRoomPass').value.trim();
 const send=document.getElementById('mSend').checked;
 if(!roomId){showToast('Room ID required',false);return;}
 if(!pass){showToast('Room Password required',false);return;}
 try{await Api.updateMatchStatus(ongoingMatchId,'ongoing',{roomId,roomPassword:pass,sendNotification:send}); showToast('Status -> ongoing, notified '+ (send?'joined users':'none'),true); closeOngoingModal(); loadMatches();}catch(e){showToast(e.message,false);}
}
async function viewMatch(id){
 try{
  const d=await Api.getParticipants(id); const list=d.participants||[];
  let html='';
  if(!list.length) html='<div class="text-sm text-slate-400 p-4">No participants</div>';
  else {
   for(const p of list){
    const names=p.inGameNames||[];
    const slots=p.slots||[];
    const uname=escapeHtml(p.username||p.uid||'Unknown');
    const n=Math.max(names.length, slots.length);
    if(n===0) html+=`<div class='text-xs p-2 border-b'>${uname} <span class='text-slate-400'>(no names)</span> kills:${p.kills||0} win:${p.winning||0}</div>`;
    else for(let i=0;i<n;i++){ const gn=escapeHtml(names[i]||''); const sl=escapeHtml(String(slots[i]||'')); html+=`<div class='text-xs p-2 border-b flex justify-between'><span>${uname} &middot; ${gn}${sl?' <span class=text-slate-400>slot:'+sl+'</span>':''}</span><span class='text-slate-500'>kills:${p.kills||0} win:${p.winning||0}</span></div>`; }
   }
  }
  const w=window.open('','_blank','width=600,height=650'); w.document.write('<html><head><title>Participants</title><style>body{font-family:system-ui;padding:12px}</style></head><body><h3>Participants ('+list.length+' users)</h3>'+html+'</body></html>'); w.document.close();
 }catch(e){showToast(e.message,false);}
}
async function openStatusModal(id,cur){
 const ns=cur==='upcoming'?'ongoing':cur==='ongoing'?'result':'upcoming';
 if(ns==='ongoing'){ ongoingMatchId=id; document.getElementById('mRoomId').value=''; document.getElementById('mRoomPass').value=''; document.getElementById('mSend').checked=true; document.getElementById('ongoingModal').classList.remove('hidden'); return; }
 else if(ns==='result'){ let notice=prompt('Notice (optional):')||''; try{ const d=await Api.getParticipants(id); const parts=d.participants||[]; if(!parts.length){showToast('No participants',false);return;} const results=[]; for(const p of parts){ const killsStr=prompt(`Kills for ${p.username||p.uid}:`,'0'); if(killsStr===null) return; const winStr=prompt(`Winning for ${p.username||p.uid}:`,'0'); if(winStr===null) return; results.push({uid:p.uid,playerName:(p.inGameNames||[p.username])[0],kills:Number(killsStr)||0,winning:Number(winStr)||0}); } await Api.updateMatchStatus(id,'result',{results,notice}); showToast('Result saved',true); loadMatches(); }catch(e){showToast(e.message,false);} }
 else {showToast('Already result',false);}
}
async function changeStatus(id,status){
 if(!status) return;
 try{await Api.updateMatch(id,{status});showToast("Status updated",true);loadMatches();}catch(e){showToast(e.message,false);}
}
async function editMatch(id){
 try{
  const data=await Api.getMatch(id);
  const m=data.match||data;
  document.getElementById("fCategory").value=m.categoryId||"";
  document.getElementById("fBannerUrl").value=m.bannerUrl||"";
  document.getElementById("fTitle").value=m.title||"";
  document.getElementById("fMatchNumber").value=m.matchNumber||"";
  document.getElementById("fTimeDate").value=isoToLocal(m.timeDate)||"";
  const pt=(String(m.prizeType||"").toLowerCase()==="survival")?"survival":"all";
  document.getElementById("fPrizeType").value=pt;togglePrizeType();
  if(pt==="all"){document.getElementById("fPrizePool").value=m.prizePool!=null?m.prizePool:"";}
  else{
   const ps=m.prizeSurvival||{};for(let i=1;i<=10;i++) document.getElementById("fRank"+i).value=ps["r"+i]!=null?ps["r"+i]:"";
   const tot=ps.total!=null?ps.total:(m.prizeTotal!=null?m.prizeTotal:m.prizePool);document.getElementById("fPrizeTotal").value=tot!=null?tot:"";document.getElementById("fPrizeTotal").dataset.manual=tot?"1":"";calcTotal();
  }
  document.getElementById("fPerKill").value=m.perKill!=null?m.perKill:"";
  document.getElementById("fEntryFeeType").value=(String(m.entryFeeType||"").toLowerCase()==="free")?"free":"paid";toggleEntryFee();
  document.getElementById("fEntryFee").value=m.entryFee!=null?m.entryFee:"";
  if(document.getElementById("fEntryFeeType").value==="free") document.getElementById("fEntryFee").value=0;
  document.getElementById("fTeamType").value=m.teamType||"Solo";
  document.getElementById("fVersion").value=m.version||"TPP";
  document.getElementById("fMap").value=m.map||"";
  document.getElementById("fSlots").value=m.slots!=null?m.slots:"";
  document.getElementById("fStatus").value=String(m.status||"upcoming").toLowerCase();
  document.getElementById("fAbout").value=m.about||m.rules||"";
  editingId=id;document.getElementById("createBtn").textContent="Update Match";document.getElementById("cancelEditBtn").classList.remove("hidden");
  document.getElementById("matchForm").scrollIntoView({behavior:"smooth",block:"start"});
 }catch(e){showToast(e.message,false);}
}
async function delMatch(id){
 if(!confirm("Delete this match?")) return;
 try{await Api.deleteMatch(id);showToast("Deleted",true);loadMatches();}catch(e){showToast(e.message,false);}
}
document.getElementById("cancelEditBtn").addEventListener("click",resetEdit);
document.getElementById("matchForm").addEventListener("submit",async(e)=>{
 e.preventDefault();
 const prizeType=document.getElementById("fPrizeType").value;
 let payload={
  categoryId: document.getElementById("fCategory").value.trim(),
  bannerUrl: document.getElementById("fBannerUrl").value.trim(),
  title: document.getElementById("fTitle").value.trim(),
  matchNumber: document.getElementById("fMatchNumber").value.trim(),
  timeDate: document.getElementById("fTimeDate").value ? new Date(document.getElementById("fTimeDate").value).toISOString() : "",
  prizeType: prizeType,
  perKill: Number(document.getElementById("fPerKill").value),
  entryFeeType: document.getElementById("fEntryFeeType").value,
  entryFee: Number(document.getElementById("fEntryFee").value),
  teamType: document.getElementById("fTeamType").value,
  version: document.getElementById("fVersion").value,
   map: document.getElementById("fMap").value.trim(),
   slots: Number(document.getElementById("fSlots").value),
   status: document.getElementById("fStatus").value,
   about: document.getElementById("fAbout").value
  };
 if(prizeType==="all"){
   payload.prizePool=Number(document.getElementById("fPrizePool").value);
 } else {
   const r={};
   let sum=0;
   for(let i=1;i<=10;i++){const v=Number(document.getElementById("fRank"+i).value); r["r"+i]=isNaN(v)?0:v; sum+=r["r"+i];}
   let totalVal=document.getElementById("fPrizeTotal").value;
   let total=totalVal===""?sum:Number(totalVal);
   r.total=total;
   payload.prizeSurvival=r;
   payload.prizePool=total;
 }
 if(!payload.categoryId){showToast("Select category",false);return;}
 const btn=document.getElementById("createBtn");btn.disabled=true;btn.textContent=editingId?"Updating...":"Creating...";
 try{
  if(editingId){await Api.updateMatch(editingId,payload);showToast("Match updated!",true);}
  else {await Api.createMatch(payload);showToast("Match created!",true);}
  resetEdit();loadMatches();
 }catch(ex){showToast(ex.message,false);}
 btn.disabled=false;btn.textContent=editingId?"Update Match":"Create Match";if(!editingId) btn.textContent="Create Match";
});
document.getElementById("refreshBtn").addEventListener("click",loadMatches);
document.getElementById("retryBtn").addEventListener("click",loadMatches);
document.getElementById("filterCategory").addEventListener("change",loadMatches);
document.getElementById("filterStatus").addEventListener("change",loadMatches);
loadCategories().then(loadMatches);
</script>
