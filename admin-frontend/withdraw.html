<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="min-h-screen text-slate-800">
<div class="aurora"><span></span><span></span><span></span></div>
<div class="flex min-h-screen">
<button id="menuBtn" class="md:hidden fixed top-4 left-4 z-20 btn-grad text-white rounded-2xl px-3.5 py-2 font-bold">☰</button>
<aside id="sidebar" class="hidden md:flex flex-col w-64 shrink-0 fixed md:static inset-y-0 left-0 z-10 p-6 text-white" style="background: linear-gradient(180deg, #0f0b2d, #2e1065 70%, #4c1d95);">
<div class="flex items-center gap-2.5 mb-10">
<div class="w-10 h-10 rounded-2xl bg-white text-lg font-extrabold flex items-center justify-center shadow-lg"><span class="grad-text">G</span></div>
<div><h2 class="text-lg font-extrabold leading-none">GameZone</h2><p class="text-[11px] text-violet-300 mt-1">Admin Panel</p></div>
</div>
<nav class="space-y-2 text-sm font-semibold">
<a href="/dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10"/></svg> Dashboard</a>
<a href="/send-notification.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg> Send Notification</a>
<a href="/history.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> History</a>
<a href="/users.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg> Users</a>
<a href="/categories.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg> Category Management</a>
<a href="/matches.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg> Match Management</a>
<a href="/settings.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.2 4.2l2.8 2.8M17 17l2.8 2.8M1 12h4M19 12h4M4.2 19.8l2.8-2.8M17 7l2.8-2.8"/></svg> Settings</a>
<a href="/payment-api.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> Payment API</a>
<a href="/deposits.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 7H9.5a3 3 0 000 6h5a3 3 0 010 6H6"/></svg> Deposits</a>
<a href="/withdraw.html" class="nav-active flex items-center gap-3 px-4 py-3 rounded-2xl text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 10h20M6 15h4"/></svg> Withdraw</a>

<button onclick="Api.logout()" class="text-left px-4 py-3 rounded-2xl text-rose-300 hover:bg-white/10 font-semibold text-sm mt-auto transition">Logout</button>
</aside>
<div id="overlay" class="hidden fixed inset-0 bg-black/40 z-[5] md:hidden"></div>
<main class="flex-1 p-6 md:p-10 pt-16 md:pt-10 w-full max-w-6xl mx-auto">
<div class="mb-6 anim-in"><h1 class="text-2xl md:text-3xl font-extrabold">Withdraw <span class="grad-text">Requests</span></h1><p class="text-sm text-slate-500 mt-1">Review and approve/reject withdrawals</p></div>
<div id="toast" class="hidden fixed top-5 right-5 z-30 px-5 py-3 rounded-2xl text-white text-sm font-semibold shadow-lg"></div>
<div class="glass shadow-xl rounded-3xl p-5 anim-in d1 overflow-x-auto">
<table class="w-full text-sm">
<thead><tr class="text-left text-slate-500"><th class="py-3 px-3">Date</th><th class="py-3 px-3">User</th><th class="py-3 px-3">Email</th><th class="py-3 px-3">UPI ID</th><th class="py-3 px-3">Amount</th><th class="py-3 px-3">Method</th><th class="py-3 px-3">Status</th><th class="py-3 px-3">Actions</th></tr></thead>
<tbody id="tbody"><tr><td colspan="8" class="text-center py-8 text-slate-400">Loading...</td></tr></tbody>
</table>
<div class="flex justify-between items-center mt-4"><button id="prev" class="px-4 py-2 rounded-xl bg-slate-100">Prev</button><span id="pageInfo" class="text-sm text-slate-500"></span><button id="next" class="px-4 py-2 rounded-xl bg-slate-100">Next</button></div>
</div>
</main>
</div>
<script src="/js/api.js?v=2"></script>
<script>
Api.requireAuth();
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");
function toggleMenu(force){ const show=force!==undefined?force:sidebar.classList.contains("hidden"); sidebar.classList.toggle("hidden",!show); overlay.classList.toggle("hidden",!show); }
document.getElementById("menuBtn").addEventListener("click",()=>toggleMenu());
overlay.addEventListener("click",()=>toggleMenu(false));
let page=1,limit=20;
function showToast(msg,ok){ const t=document.getElementById("toast"); t.textContent=msg; t.className="fixed top-5 right-5 z-30 px-5 py-3 rounded-2xl text-white text-sm font-semibold shadow-lg "+(ok?"bg-emerald-600":"bg-rose-600"); t.classList.remove("hidden"); setTimeout(()=>t.classList.add("hidden"),2500); }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
async function load(){
 try{
  const data=await Api.getWithdrawals(page,limit);
  const items=data.items||[];
  const tbody=document.getElementById("tbody");
  if(items.length===0){ tbody.innerHTML='<tr><td colspan="8" class="text-center py-8 text-slate-400">No withdrawals</td></tr>'; }
  else{
   tbody.innerHTML=items.map(it=>{
    const status=it.status||"pending";
    const pill=status==="success"?"bg-emerald-100 text-emerald-700":status==="rejected"?"bg-rose-100 text-rose-700":"bg-amber-100 text-amber-700";
    const actions=status==="pending"?`<button onclick="act('${it.id}','approve')" class="px-3 py-1 rounded-lg bg-emerald-600 text-white text-xs mr-1">Approve</button><button onclick="act('${it.id}','reject')" class="px-3 py-1 rounded-lg bg-rose-600 text-white text-xs">Reject</button>`:"-";
    return `<tr class="border-t"><td class="py-2 px-3 text-xs">${esc((it.createdAt||"").slice(0,16))}</td><td class="py-2 px-3">${esc(it.username||it.uid||"")}</td><td class="py-2 px-3 text-xs">${esc(it.email||"")}</td><td class="py-2 px-3 text-xs">${esc(it.upiId||"")}</td><td class="py-2 px-3 font-bold">₹${it.amount||0}</td><td class="py-2 px-3">${esc(it.method||"")}</td><td class="py-2 px-3"><span class="px-2 py-1 rounded-full text-xs ${pill}">${esc(status)}</span></td><td class="py-2 px-3">${actions}</td></tr>`;
   }).join("");
  }
  document.getElementById("pageInfo").textContent=`Page ${data.page||page} / ${data.totalPages||1} • Total ${data.total||0}`;
 }catch(e){ document.getElementById("tbody").innerHTML='<tr><td colspan="8" class="text-center py-8 text-rose-500">'+esc(e.message)+'</td></tr>'; }
}
async function act(id,action){
 if(!confirm(action==="approve"?"Approve this withdrawal?":"Reject and refund winCoins?")) return;
 try{ await Api.updateWithdraw(id,action); showToast(action==="approve"?"Approved":"Rejected & refunded",true); load(); }catch(e){ showToast(e.message,false); }
}
document.getElementById("prev").addEventListener("click",()=>{ if(page>1){ page--; load(); }});
document.getElementById("next").addEventListener("click",()=>{ page++; load(); });
load();
</script>
</body>
</html>
