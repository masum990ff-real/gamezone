<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GameZone Admin - Send Notification</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/premium.css" />
</head>
<body class="min-h-screen text-slate-800">
<div class="aurora"><span></span><span></span><span></span></div>

<div class="flex min-h-screen">
<button id="menuBtn" class="md:hidden fixed top-4 left-4 z-20 btn-grad text-white rounded-2xl px-3.5 py-2 font-bold">☰</button>
<aside id="sidebar" class="hidden md:flex flex-col w-64 shrink-0 fixed md:static inset-y-0 left-0 z-10 p-6 text-white" style="background: linear-gradient(180deg, #0f0b2d, #2e1065 70%, #4c1d95);">
<div class="flex items-center gap-2.5 mb-10">
<div class="w-10 h-10 rounded-2xl bg-white text-lg font-extrabold flex items-center justify-center shadow-lg"><span class="grad-text">G</span></div>
<div>
<h2 class="text-lg font-extrabold leading-none">GameZone</h2>
<p class="text-[11px] text-violet-300 mt-1">Admin Panel</p>
</div>
</div>
<nav class="space-y-2 text-sm font-semibold">
<a href="/dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10"/></svg>
Dashboard</a>
<a href="/send-notification.html" class="nav-active flex items-center gap-3 px-4 py-3 rounded-2xl text-white">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
Send Notification</a>
<a href="/history.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
History</a>
<a href="/users.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-violet-200 hover:bg-white/10 transition">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
Users</a>
</nav>
<button onclick="Api.logout()" class="text-left px-4 py-3 rounded-2xl text-rose-300 hover:bg-white/10 font-semibold text-sm mt-auto transition">Logout</button>
</aside>
<div id="overlay" class="hidden fixed inset-0 bg-black/40 z-[5] md:hidden"></div>

<main class="flex-1 p-6 md:p-10 pt-16 md:pt-10 w-full max-w-5xl mx-auto">
<div class="mb-6 anim-in">
<h1 class="text-2xl md:text-3xl font-extrabold">Send <span class="grad-text">Notification</span></h1>
<p class="text-sm text-slate-500 mt-1">Broadcast to all users subscribed to <span class="font-mono font-bold text-violet-600">all_users</span></p>
</div>

<div class="grid lg:grid-cols-2 gap-5 items-start">
<form id="sendForm" class="anim-in d1 glass shadow-xl rounded-3xl p-6 space-y-4">
<div>
<div class="flex justify-between items-center mb-1.5">
<label class="text-sm font-bold">Title *</label>
<span id="titleCount" class="text-xs text-slate-400">0/100</span>
</div>
<input id="title" type="text" required maxlength="100" placeholder="e.g. Weekend Bonus is live!"
class="field w-full border border-violet-200 rounded-2xl px-4 py-3 bg-white/70" />
</div>
<div>
<div class="flex justify-between items-center mb-1.5">
<label class="text-sm font-bold">Message *</label>
<span id="bodyCount" class="text-xs text-slate-400">0/500</span>
</div>
<textarea id="body" required maxlength="500" rows="4" placeholder="Write your message..."
class="field w-full border border-violet-200 rounded-2xl px-4 py-3 bg-white/70 resize-none"></textarea>
</div>
<div>
<label class="block text-sm font-bold mb-1.5">Image URL <span class="font-medium text-slate-400">(optional)</span></label>
<input id="imageUrl" type="url" placeholder="https://..."
class="field w-full border border-violet-200 rounded-2xl px-4 py-3 bg-white/70" />
</div>
<button id="sendBtn" type="submit" class="btn-grad w-full text-white font-bold rounded-2xl px-6 py-4">Send to all users</button>
</form>

<div class="anim-in d2 lg:sticky lg:top-6">
<p class="text-sm font-bold text-slate-500 mb-2">Live preview</p>
<div class="mx-auto max-w-[300px] rounded-[2rem] bg-slate-900 p-2.5 shadow-2xl">
<div class="rounded-[1.6rem] bg-gradient-to-b from-slate-50 to-violet-50 overflow-hidden">
<div class="text-center text-[11px] text-slate-400 py-2 font-semibold">Notification preview</div>
<div class="mx-3 mb-4 rounded-2xl bg-white shadow-lg p-3.5 flex gap-3">
<div class="w-10 h-10 rounded-xl shrink-0 flex items-center justify-center text-white font-extrabold" style="background: var(--grad);">G</div>
<div class="min-w-0">
<p id="pvTitle" class="text-[13px] font-bold text-slate-800 truncate">Your title here</p>
<p id="pvBody" class="text-xs text-slate-500 mt-0.5" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">Your message will appear here…</p>
<p class="text-[10px] text-slate-400 mt-1">GameZone · now</p>
</div>
</div>
<img id="pvImage" class="hidden mx-3 mb-4 rounded-2xl w-[calc(100%-1.5rem)] h-32 object-cover" alt="" />
</div>
</div>
</div>
</div>

<div id="toast" class="hidden max-w-xl mt-4 rounded-2xl px-4 py-3.5 text-sm font-semibold shadow-lg"></div>
</main>
</div>
<script src="/js/api.js"></script>
<script>
Api.requireAuth();
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
function toggleMenu(force) {
  const show = force !== undefined ? force : sidebar.classList.contains("hidden");
  sidebar.classList.toggle("hidden", !show);
  overlay.classList.toggle("hidden", !show);
}
document.getElementById("menuBtn").addEventListener("click", () => toggleMenu());
overlay.addEventListener("click", () => toggleMenu(false));

const form = document.getElementById("sendForm");
const btn = document.getElementById("sendBtn");
const toast = document.getElementById("toast");
const titleEl = document.getElementById("title");
const bodyEl = document.getElementById("body");
const imgEl = document.getElementById("imageUrl");

function showToast(msg, ok) {
  toast.textContent = msg;
  toast.className = "toast-in max-w-xl mt-4 rounded-2xl px-4 py-3.5 text-sm font-semibold shadow-lg " +
    (ok ? "bg-emerald-500 text-white" : "bg-rose-500 text-white");
}
function syncPreview() {
  document.getElementById("pvTitle").textContent = titleEl.value.trim() || "Your title here";
  document.getElementById("pvBody").textContent = bodyEl.value.trim() || "Your message will appear here…";
  document.getElementById("titleCount").textContent = titleEl.value.length + "/100";
  document.getElementById("bodyCount").textContent = bodyEl.value.length + "/500";
  const pvImg = document.getElementById("pvImage");
  if (imgEl.value.trim()) { pvImg.src = imgEl.value.trim(); pvImg.classList.remove("hidden"); }
  else pvImg.classList.add("hidden");
}
titleEl.addEventListener("input", syncPreview);
bodyEl.addEventListener("input", syncPreview);
imgEl.addEventListener("input", syncPreview);

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const title = titleEl.value.trim();
  const body = bodyEl.value.trim();
  const imageUrl = imgEl.value.trim();
  if (!title || !body) {
    showToast("Title and message required", false);
    return;
  }
  btn.disabled = true;
  btn.textContent = "Sending...";
  try {
    const data = await Api.sendNotification(title, body, imageUrl);
    showToast(`Sent! Reach ~${data.successCount} devices`, true);
    form.reset();
    syncPreview();
  } catch (ex) {
    showToast(ex.message, false);
  }
  btn.disabled = false;
  btn.textContent = "Send to all users";
});
</script>
</body>
</html>
